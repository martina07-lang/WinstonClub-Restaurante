<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería - Winston Club</title>
    <link rel="stylesheet" href="style.CSS">
</head>

<body>

<header class="encabezado">
    <div class="nombre-bar">
        WINSTON
        <span>CLUB</span>
    </div>
</header>

<main class="pagina-categoria">

    <a href="index.html" class="volver">← Volver a la carta</a>

    <h1 class="titulo-categoria">CAFETERÍA</h1>

    <div class="lista-productos">

        <div class="producto">
            <img src="./Imagenes/submarino.jpg" alt="Submarino">
            <div class="producto-info">
                <h2>Submarino</h2>
                <p>Café espresso.</p>
                <span class="precio">$5.000</span>
            </div>
        </div>

        <div class="producto">
            <img src="./Imagenes/cafe con leche.jpg" alt="Café con leche">
            <div class="producto-info">
                <h2>Café con leche</h2>
                <p>Café acompañado con leche.</p>
                <span class="precio">$3.000</span>
            </div>
        </div>

        <div class="producto">
            <img src="./Imagenes/capuchino.jpg" alt="Cappuccino">
            <div class="producto-info">
                <h2>Cappuccino</h2>
                <p>Café con leche espumada.</p>
                <span class="precio">$3.500</span>
            </div>
        </div>

        <div class="producto">
            <img src="./Imagenes/medialunas.jpg" alt="Medialunas">
            <div class="producto-info">
                <h2>Medialunas </h2>
                <p>Café con leche espumada.</p>
                <span class="precio">$1.500 c/u</span>
            </div>
        </div>

        <div class="producto">
            <img src="./Imagenes/Tostados.jpg" alt="Tostados">
            <div class="producto-info">
                <h2>Tostados - 4</h2>
                <p>Café con leche espumada.</p>
                <span class="precio">$9.000 c/u</span>
            </div>
        </div>
    </div>

</main>

</body>
</html>
